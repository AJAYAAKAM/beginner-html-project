<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(to right, #4facfe, #00f2fe);
    }

    .login-box{
      width:320px;
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
    }

    .login-box h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .input-box{
      margin-bottom:20px;
    }

    .input-box input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      font-size:16px;
    }

    .input-box input:focus{
      border-color:#4facfe;
    }

    .login-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#4facfe;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#008cdd;
    }

    .extra{
      text-align:center;
      margin-top:15px;
      font-size:14px;
    }

    .extra a{
      text-decoration:none;
      color:#4facfe;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>

    <div class="input-box">
      <input type="text" placeholder="Enter Username">
    </div>

    <div class="input-box">
      <input type="password" placeholder="Enter Password">
    </div>

    <button class="login-btn">Login</button>

    <div class="extra">
      <p>Forgot Password? <a href="#">Click Here</a></p>
    </div>
  </div>

</body>
</html>
